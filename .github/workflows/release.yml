name: Release

# Publishes to npm when a version tag is pushed (`npm version minor && git push --follow-tags`),
# then makes the GitHub release from the version's section of CHANGELOG.md.
# npm authenticates this workflow as a trusted publisher (OIDC), so there is no npm token in
# the repository secrets. docs/releasing.md has the setup.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); also signs the provenance statement

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or later).
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a job that can publish: a poisoned cache would run here.
          package-manager-cache: false
      - name: The tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      # No version goes out without release notes: they become the GitHub release below.
      - name: CHANGELOG.md has notes for this version
        run: node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > /dev/null
      - run: npm ci
      - run: npm run test:package
      # prepublishOnly runs lint, typecheck and the unit tests; prepack builds dist/.
      # A prerelease version (1.2.0-beta.1) goes to the `next` dist-tag, not `latest`. A version
      # already on npm (the first one is published by hand, or a re-run) is left alone.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "comet-deploy@$version" version > /dev/null 2>&1; then
            echo "comet-deploy@$version is already on npm; nothing to publish."
            exit 0
          fi
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; this job has no id-token and cannot publish to npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # The notes are the version's section of CHANGELOG.md. A re-run updates the release.
      - name: GitHub release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            case "$GITHUB_REF_NAME" in
              *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --prerelease ;;
              *) gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" ;;
            esac
          fi

name: Release

# Publishes to npm when a version tag is pushed (`npm version minor && git push --follow-tags`).
# npm authenticates this workflow as a trusted publisher (OIDC), so there is no npm token in
# the repository secrets. docs/releasing.md has the setup.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); also signs the provenance statement

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or later).
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a job that can publish: a poisoned cache would run here.
          package-manager-cache: false
      - name: The tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run test:package
      # prepublishOnly runs lint, typecheck and the unit tests; prepack builds dist/.
      # A prerelease version (1.2.0-beta.1) goes to the `next` dist-tag, not `latest`. A version
      # already on npm (the first one is published by hand, or a re-run) is left alone.
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "comet-deploy@$version" version > /dev/null 2>&1; then
            echo "comet-deploy@$version is already on npm; nothing to publish."
            exit 0
          fi
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
